<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
  <h1 id="event-title">Ночь в музее</h1>
  <p id="event-date-and-time">15 ноября, 18:30</p>
  <p id="event-place">Музей космонавтики, проспект Мира, 111</p>
  <p id="event-info">Вечерняя программа с выставкой и экскурсиями</p>

  <p id="data-error" class="error" hidden>Ошибка данных.</p>

  <form id="service-form">
    <label><input id="guide" type="checkbox" name="withGuide"> Экскурсия с гидом</label>
    <label><input id="audio" type="checkbox" name="withAudio"> Аудиогид</label>
    <label><input id="catalog" type="checkbox" name="withCatalog"> Каталог выставки</label>
    <button type="submit">Добавить услуги</button>
  </form>

  <p id="choice-error" class="error" hidden>Выберите хотя бы одну услугу.</p>

  <div id="result" class="output" hidden></div>
  <p id="report-json" class="output" hidden></p>

  <button id="show-program" type="button">Показать программу</button>
  <div id="program" class="program" hidden></div>
</main>

  <script src="app.js"></script>
</body>

</html>
